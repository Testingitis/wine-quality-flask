<!DOCTYPE html>

<html>
<head>

    <title>Wine Quality Predictor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>🍷 Wine Quality Predictor</h1>

    <p>
        Enter the wine characteristics to predict its quality.
    </p>


    <form action="/predict" method="POST">

        <label>Fixed Acidity</label>
        <input
            type="number"
            step="any"
            name="fixed acidity"
            placeholder="7.4"
            required
        >

        <label>Volatile Acidity</label>
        <input
            type="number"
            step="any"
            name="volatile acidity"
            placeholder="0.70"
            required
        >

        <label>Citric Acid</label>
        <input
            type="number"
            step="any"
            name="citric acid"
            placeholder="0.00"
            required
        >

        <label>Residual Sugar</label>
        <input
            type="number"
            step="any"
            name="residual sugar"
            placeholder="1.9"
            required
        >

        <label>Chlorides</label>
        <input
            type="number"
            step="any"
            name="chlorides"
            placeholder="0.076"
            required
        >

        <label>Free Sulfur Dioxide</label>
        <input
            type="number"
            step="any"
            name="free sulfur dioxide"
            placeholder="11"
            required
        >

        <label>Total Sulfur Dioxide</label>
        <input
            type="number"
            step="any"
            name="total sulfur dioxide"
            placeholder="34"
            required
        >

        <label>Density</label>
        <input
            type="number"
            step="any"
            name="density"
            placeholder="0.9978"
            required
        >

        <label>pH</label>
        <input
            type="number"
            step="any"
            name="pH"
            placeholder="3.51"
            required
        >

        <label>Sulphates</label>
        <input
            type="number"
            step="any"
            name="sulphates"
            placeholder="0.56"
            required
        >

        <label>Alcohol</label>
        <input
            type="number"
            step="any"
            name="alcohol"
            placeholder="9.4"
            required
        >


        <button type="submit">
            Predict Wine Quality
        </button>

    </form>


    {% if prediction is defined %}

        <div class="result">

            <h2>Predicted Wine Quality</h2>

            <div class="score">
                {{ prediction }}
            </div>

        </div>

    {% endif %}

</div>

</body>
</html>
